log file /var/log/sdplane.log
log stdout
#set pager

#debug fdb
#debug router

set device 01:00.0 driver unbound
set device 01:00.0 driver vfio-pci driver_override
set device 01:00.0 driver vfio-pci bind

set device 01:00.1 driver unbound
set device 01:00.1 driver vfio-pci driver_override
set device 01:00.1 driver vfio-pci bind

#set device 02:00.0 driver unbound
#set device 02:00.0 driver vfio-pci driver_override
#set device 02:00.0 driver vfio-pci bind

#set device 03:00.0 driver unbound
#set device 03:00.0 driver vfio-pci driver_override
#set device 03:00.0 driver vfio-pci bind

set argv-list 3 sh /home/yasu/netlink-hook-br-2-00-0.sh
set netlink-hook 1 ipv6 ifaddr new ifname br-2-00-0 argv-list 3

set rte_eal argv -c 0xff

rte_eal_init
set mempool 12000

#set worker lcore 1 rib-manager
#start worker lcore 1
#set worker lcore 2 netlink-thread

set worker lthread rib-manager
set worker lthread netlink-thread

set worker lthread stat-collector
set worker lthread neigh-manager

set worker lcore 1 l3-tap-handler
set worker lcore 2 router
set worker lcore 3 router
set worker lcore 4 router
set worker lcore 5 router
set worker lcore 6 router
set worker lcore 7 router

# need to stop port before changing ports.
stop port all
set port all dev-configure 1 8
set port all nrxdesc 1024
set port all ntxdesc 1024

set port all promiscuous enable
start port all

# queue config should be after rib-manager.
set thread 2 port 0 queue 0
set thread 3 port 0 queue 1
set thread 4 port 0 queue 2
set thread 5 port 0 queue 3
set thread 6 port 0 queue 4
set thread 7 port 1 queue 0

# waiting for the port to come up.
sleep 5

# update port status
start worker lcore all

set vswitch 1 vlan 1
set vswitch 1 port 0 untag
set vswitch 1 router-if port-1-00-0 vlan-id 0
set vswitch 1 capture-if capture-1-00-0

set vswitch 2 vlan 2
set vswitch 2 port 1 untag
set vswitch 2 router-if port-1-00-1 vlan-id 0
set vswitch 2 capture-if capture-1-00-1

set port all rss all on

# igc NICs need these two.
#set port 2 link up
#update port status

set fdb port 1 vlan 2 lladdr AA:BB:CC:DD:EE:FF

