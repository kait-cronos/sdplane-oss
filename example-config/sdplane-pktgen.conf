
log file /var/log/sdplane.log
log stdout

#debug sdplane fdb-change
#debug sdplane rib
#debug sdplane netlink
#debug sdplane vlan-switch

set device 01:00.0 driver unbound
set device 01:00.0 driver vfio-pci driver_override
set device 01:00.0 driver vfio-pci bind

set device 01:00.1 driver unbound
set device 01:00.1 driver vfio-pci driver_override
set device 01:00.1 driver vfio-pci bind

set device 03:00.0 driver unbound
set device 03:00.0 driver vfio-pci driver_override
set device 03:00.0 driver vfio-pci bind

set argv-list 2 ./usr/local/bin/pktgen -l 0-7 -n 4 --proc-type auto --log-level 7 --file-prefix pg -- -v -T -P -l pktgen.log -m [1:2].0 -m [3:4].1 -m [5:6].2 -f themes/black-yellow.theme
pktgen init argv-list 2

#set rte_eal argv -c 0xff
#rte_eal_init

set mempool

set worker lthread stat-collector
set worker lthread rib-manager
set worker lthread netlink-thread
set worker lthread neigh-manager

# need to stop port before changing ports.
stop port all
set port all dev-configure 1 8
set port all nrxdesc 1024
set port all ntxdesc 1024

# set worker lcore 2 vlan-switch
# set worker lcore 3 tap-handler
set worker lcore 1 pktgen
set worker lcore 2 pktgen
set worker lcore 3 pktgen
set worker lcore 4 pktgen
set worker lcore 5 pktgen
set worker lcore 6 pktgen
set worker lcore 7 pktgen

pktgen do set port 0 mac destination 2A:B7:13:27:FC:78

pktgen do set port 0 ipv4 source 10.0.1.1
pktgen do set port 0 ipv4 destination 10.0.2.135

pktgen do set port 0 range ip dst start 10.0.2.135
pktgen do set port 0 range ip dst min 10.0.2.135
pktgen do set port 0 range ip dst max 10.0.2.135
pktgen do set port 0 range ip dst inc 0.0.0.0

pktgen do set port 0 range mac dst start 2A:B7:13:27:FC:78
pktgen do set port 0 range mac dst min 2A:B7:13:27:FC:78
pktgen do set port 0 range mac dst max 2A:B7:13:27:FC:78
pktgen do set port 0 range mac dst inc 00:00:00:00:00:00

pktgen do set port 0 range ip src start 10.0.1.128
pktgen do set port 0 range ip src min 10.0.1.128
pktgen do set port 0 range ip src max 10.0.1.255
pktgen do set port 0 range ip src inc 0.0.0.1
pktgen do set port 0 range enable

set port all promiscuous enable
start port all

# start all thread.
start worker lcore all

pktgen do start port 0
pktgen do set port 0 rate 1

