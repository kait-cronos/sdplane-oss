log stdout

set argv-list 0 sdplane --lcores=0@0,1@1 --main-lcore=1 -a 0000:03:00.0 -a 0000:01:00.0 -a 0000:01:00.1
rte_eal_init argv-list 0
set mempool

set worker lthread rib-manager
set worker lthread stat-collector
set worker lcore 0 l2-switch

stop port all
set port all nrxq 2
set port all ntxq 2
set port all nrxdesc 512
set port all ntxdesc 512
set port all promiscuous enable

set thread 0 port 0 queue 0
set thread 0 port 1 queue 0
set thread 0 port 2 queue 0
set thread 0 port 0 queue 1
set thread 0 port 1 queue 1
set thread 0 port 2 queue 1

sleep 2
start port all
sleep 5
update port status
sleep 1

set vswitch 1 vlan 1
set vswitch 1 port 0 untag
set vswitch 1 port 1 untag
set vswitch 1 port 2 untag
sleep 1

start worker lcore all
sleep 5
update port status
sleep 1
show port
