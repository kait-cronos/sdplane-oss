# Route loss benchmark: rib-manager on lcore, netlink-thread on lthread.

log stdout

set rte_eal argv -l 0-3 --vdev=net_af_packet0,iface=a-out

rte_eal_init
set mempool 12000

set worker lthread stat-collector
set worker lthread neigh-manager
set worker lthread rcu-reporter

set worker lcore 1 l3-tap-handler
set worker lcore 2 router

set worker lcore 3 rib-manager
start worker lcore 3
set worker lthread netlink-thread

# need to stop port before changing ports.
stop port all
set port all dev-configure 1 1
set port all nrxdesc 1024
set port all ntxdesc 1024

set port all promiscuous enable
start port all

# queue config should be after rib-manager.
set thread 2 port 0 queue 0

# waiting for the port to come up.
sleep 5

start worker lcore 1
start worker lcore 2

set vswitch 1 vlan 1
set vswitch 1 port 0 untag
set vswitch 1 router-if router vlan-id 0

set port all rss all on

set fdb port 1 vlan 2 lladdr AA:BB:CC:DD:EE:FF
